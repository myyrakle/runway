[package]
name = "sentiment-service-rs"
version = "0.1.0"
edition = "2021"
description = "DeBERTa v3 ABSA sentiment analysis served over a slim native TensorRT runtime (Rust)"
license = "MIT"

[[bin]]
name = "sentiment-service-rs"
path = "src/main.rs"

[features]
# Default build is GPU-free: it uses the CPU `stub` backend so the HTTP/tokenizer/
# batching layer compiles and is testable without CUDA/TensorRT. The deployment
# image builds with `--features trt`, which compiles cpp/trt_shim.cpp (build.rs)
# and links libnvinfer + cudart for real engine inference.
default = []
trt = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
