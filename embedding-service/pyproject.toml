[project]
name = "embedding-service"
version = "0.1.0"
description = "Multilingual E5 Large text embeddings served over FastAPI"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    # ML stack.
    "sentence-transformers>=2.7.0",
    "torch>=2.6.0,<3.0.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
