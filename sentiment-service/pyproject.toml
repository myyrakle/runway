[project]
name = "sentiment-service"
version = "0.1.0"
description = "DeBERTa v3 ABSA sentiment analysis served over FastAPI"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    # ML stack. Linux resolves torch from the PyTorch CUDA 12.8 wheel index.
    "torch==2.8.0",
    "transformers>=4.44.0,<5.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0.0",
    "safetensors>=0.4.0",
]

# Acceleration extras pinned to the CUDA 12.x line so they match the cu128 torch
# wheel and stay installable on CPython 3.10:
#   - onnxruntime-gpu PyPI wheels target CUDA 12 here; 1.24+ dropped cp310 wheels.
#   - tensorrt-cu12 forces the CUDA 12 build (plain `tensorrt` pulls the CUDA 13
#     11.x meta-package); the 10.x line keeps cp310 wheels.
[project.optional-dependencies]
onnx = [
    "onnx>=1.16.0",
    "onnxruntime-gpu>=1.18.0,<1.24",
]
tensorrt = [
    "onnx>=1.16.0",
    "onnxruntime-gpu>=1.18.0,<1.24",
    "tensorrt-cu12>=10.0.0,<11.0.0",
]
# Runtime-only subset of `tensorrt`: the native TensorRT backend (app/model.py)
# imports only `tensorrt` + `torch` at serve time — never onnx/onnxruntime, which
# are export-build tooling. The multi-stage tensorrt image installs this in its
# runtime layer so the ONNX stack never ships. Same tensorrt-cu12 pin as above so
# the .plan baked by the builder deserializes against the runtime's TensorRT.
tensorrt-runtime = [
    "tensorrt-cu12>=10.0.0,<11.0.0",
]
# Load testing only (loadtest/locustfile.py); never shipped in a serving image.
loadtest = [
    "locust>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
