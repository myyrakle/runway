[project]
name = "sentiment-service"
version = "0.1.0"
description = "DeBERTa v3 ABSA sentiment analysis served over FastAPI"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    # ML stack. transformers<5.0.0: DeBERTa-v3 tokenizer compatibility.
    "torch>=2.6.0,<3.0.0",
    "transformers>=4.44.0,<5.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0.0",
    "safetensors>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
